
name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "application/backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./application/backend
          push: true
          tags: |
            ghcr.io/maiekel-eltawab/azure-devops-project-backend:v1
            ghcr.io/maiekel-eltawab/azure-devops-project-backend:sha-${{ github.sha }}


      - name: Update Kubernetes image tag
        run: |
          IMAGE="ghcr.io/maiekel-eltawab/azure-devops-project-backend:sha-${GITHUB_SHA}"

          sed -i \
            "s|image: ghcr.io/maiekel-eltawab/azure-devops-project-backend:.*|image: ${IMAGE}|" \
            kubernetes/backend-deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/backend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "ci: update backend image to sha-${GITHUB_SHA}"
            git push origin HEAD:main
          fi
