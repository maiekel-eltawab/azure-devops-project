
name: RealWorld CI

on:
  push:
    branches:
      - main
    paths:
      - "realworld/backend/**"
      - "realworld/frontend/**"
      - ".github/workflows/realworld-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/maiekel-eltawab/azure-devops-project-realworld

jobs:
  build-backend:
    name: Build and Push Django Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./realworld/backend
          push: true
          tags: |
            ghcr.io/maiekel-eltawab/azure-devops-project-realworld-backend:latest
            ghcr.io/maiekel-eltawab/azure-devops-project-realworld-backend:sha-${{ github.sha }}

  build-frontend:
    name: Build and Push React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./realworld/frontend
          push: true
          build-args: |
            REACT_APP_BACKEND_URL=/api
          tags: |
            ghcr.io/maiekel-eltawab/azure-devops-project-realworld-frontend:latest
            ghcr.io/maiekel-eltawab/azure-devops-project-realworld-frontend:sha-${{ github.sha }}

