
# Argo CD - Single Node AKS Development Setup

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

server:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

redis-ha:
  enabled: false

dex:
  enabled: false

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

notifications:
  enabled: false
