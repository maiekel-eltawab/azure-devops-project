apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-backend
  namespace: devops-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flask-backend

  template:
    metadata:
      labels:
        app: flask-backend

    spec:
      containers:
        - name: flask-backend
          image: ghcr.io/maiekel-eltawab/azure-devops-project-backend:sha-652ab091ee2551e4a1ba137a1edbdaf478e399b3

          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_HOST

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_PASSWORD
